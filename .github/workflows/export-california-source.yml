name: Export California Source

on:
  push:
    branches:
      - "claude/new-session-e08nli"
    paths:
      - ".github/workflows/export-california-source.yml"
      - "california/**"
  pull_request:
    paths:
      - ".github/workflows/export-california-source.yml"
      - "california/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload California source package
        uses: actions/upload-artifact@v4
        with:
          name: california-source
          path: california/
          include-hidden-files: true
          retention-days: 1

      - name: Record successful private export run
        if: github.event_name == 'push'
        run: |
          mkdir -p .github/generated
          printf 'California private export completed for %s\n' "$GITHUB_SHA" > .github/generated/california-export-ran.txt
          git config user.name "StateCourse Repository Automation"
          git config user.email "westccmortgage@gmail.com"
          git add .github/generated/california-export-ran.txt
          git commit -m "Record California source export run" || exit 0
          git push
