name: Export California Source

on:
  push:
    paths:
      - ".github/workflows/export-california-source.yml"
  pull_request:
    paths:
      - ".github/workflows/export-california-source.yml"
      - "california/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload California source package
        uses: actions/upload-artifact@v4
        with:
          name: california-source
          path: california/
          include-hidden-files: true
          retention-days: 1
