name: PE03 isolated native and browser acceptance

on:
  pull_request:
    branches: [codex/pe-foundations-free-practice-20260930]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pe03-isolated-acceptance.yml'
      - 'database/drafts/pe03-cohort-evidence.sql'
      - 'config/nmls/pe-oil-definition.mjs'
      - 'netlify/functions/*pe03.mts'
      - 'netlify/functions/_lib/nmls-pe-*.mjs'
      - 'public/statecourse/student/pe03/**'
      - 'tests/helpers/pe03-*.mjs'
      - 'tests/pe03-*.test.mjs'
      - 'tests/integration/pe03-native.test.mjs'
      - 'tests/browser/pe03-local-browser.mjs'
      - 'tests/browser/pe03-driver-diagnostic.mjs'
      - 'config/nmls/pe-course/**'
      - 'config/nmls/pe-course-definition.mjs'
      - 'database/drafts/pe-course-workbench.sql'
      - 'netlify/functions/*pe-course.mts'
      - 'netlify/functions/*pe-readiness.mts'
      - 'netlify/functions/*pe-course-setup.mts'
      - 'public/statecourse/student/pe-course/**'
      - 'public/statecourse/student/pe-readiness/**'
      - 'public/statecourse/admin/pe-course-setup/**'
      - 'tests/helpers/pe-course-*.mjs'
      - 'tests/pe-course-*.test.mjs'
      - 'tests/pe-readiness-*.test.mjs'
      - 'tests/browser/pe-readiness-local-browser.mjs'
      - 'tests/pe03-readback-evidence.test.mjs'
      - 'tests/browser/pe-course-local-browser.mjs'
      - 'config/nmls/pe-final/**'
      - 'lib/nmls-pe-final-*.mjs'
      - 'lib/nmls-pe-oil-policy.mjs'
      - 'tests/pe-oil-*.test.mjs'
      - 'tests/integration/pe-oil-native.test.mjs'
      - 'tests/browser/pe-course-reading-assertions.mjs'
      - 'database/drafts/pe-final-assessment.sql'
      - 'netlify/functions/*pe-final.mts'
      - 'public/statecourse/student/pe-final/**'
      - 'tests/pe-final-*.test.mjs'
      - 'tests/helpers/pe-final-fixture.mjs'
      - 'tests/integration/pe-final-native.test.mjs'
      - 'tests/browser/pe-final-local-browser.mjs'

permissions:
  contents: read

jobs:
  isolated-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Synthetic, disposable service credentials. No repository secret values are used.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pe03_local_only
          POSTGRES_DB: pe03_ci_bootstrap
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pe03_ci_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PE03_NATIVE_CI: '1'
      PE_POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Record the disposable service port after job initialization
        run: echo "PE_POSTGRES_PORT=$PE_SERVICE_PORT" >> "$GITHUB_ENV"
        env:
          PE_SERVICE_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Check out the reviewed local-only trial
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned verification dependencies
        run: |
          package="$RUNNER_TEMP/pe03-verification"
          npm install --prefix "$package" --no-save --package-lock=false pg@8.23.1 playwright@1.63.0 @electric-sql/pglite@0.5.8 jsdom@26.1.0
          echo "PE_PG_MODULE=$package/node_modules/pg" >> "$GITHUB_ENV"
          echo "PE_PLAYWRIGHT_MODULE=$package/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PE_PGLITE_MODULE=$package/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
          echo "PE_JSDOM_MODULE=$package/node_modules/jsdom/lib/api.js" >> "$GITHUB_ENV"
          "$package/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends openbox
      - name: Prove native browser visibility, screenshots and downloads first
        run: |
          xvfb-run --auto-servernum bash -c '
            openbox > "$RUNNER_TEMP/pe03-driver-openbox.log" 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            node tests/browser/pe03-driver-diagnostic.mjs
          '
        env:
          PE_CHROMIUM_HEADED: '1'
          PLAYWRIGHT_LEGACY_SCREENSHOT: '1'
      - name: Verify localhost-only CI and staff client contracts
        run: node --test tests/pe03-ci-contract.test.mjs
      - name: Verify cohort boundaries and actual staff proof binding
        run: node --test --test-concurrency=1 tests/pe03-cohort.test.mjs tests/pe03-staff-boundary.test.mjs
      - name: Verify separate native PostgreSQL connections and lock waits
        run: node --test tests/integration/pe03-native.test.mjs
      - name: Render local UI against the disposable native PostgreSQL fixture
        # A virtual display gives real focus/visibility transitions across tabs.
        run: |
          xvfb-run --auto-servernum bash -c '
            openbox > "$RUNNER_TEMP/pe03-openbox.log" 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            node tests/browser/pe03-local-browser.mjs
          '
        env:
          PE_CHROMIUM_HEADED: '1'
          # Playwright's supported capture backend; keep real page focus/visibility.
          PLAYWRIGHT_LEGACY_SCREENSHOT: '1'
      - name: Verify PE03 evidence readback and full course with embedded PostgreSQL
        run: node --test --test-concurrency=1 tests/pe03-readback-evidence.test.mjs tests/pe-course-workbench.test.mjs tests/pe-course-dom.test.mjs tests/pe-course-staff-boundary.test.mjs
      - name: Verify full course with native PostgreSQL and unchanged production prerequisites
        run: node --test --test-concurrency=1 tests/pe-course-workbench.test.mjs tests/pe-course-dom.test.mjs tests/pe-course-staff-boundary.test.mjs
        env:
          PE_COURSE_NATIVE_CI: '1'
      - name: Verify PE restriction accounting and preserved reading
        run: node --test --test-concurrency=1 tests/pe-oil-policy.test.mjs tests/pe-oil-controls.test.mjs tests/pe-course-reading.test.mjs tests/pe-course-reading-dom.test.mjs tests/pe-course-onboarding.test.mjs tests/pe-readiness-dom.test.mjs
      - name: Verify native actor-wide PE policy and lock-wait expiry
        run: node --test --test-concurrency=1 tests/pe-oil-policy.test.mjs tests/integration/pe-oil-native.test.mjs
        env:
          PE_COURSE_NATIVE_CI: '1'
      - name: Render full course workbench with isolated native PostgreSQL
        run: |
          xvfb-run --auto-servernum bash -c '
            openbox > "$RUNNER_TEMP/pe-course-openbox.log" 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            node tests/browser/pe-course-local-browser.mjs
          '
        env:
          PE_COURSE_NATIVE_CI: '1'
          PE_CHROMIUM_HEADED: '1'
          PLAYWRIGHT_LEGACY_SCREENSHOT: '1'
      - name: Verify readiness desktop and mobile navigation
        run: node tests/browser/pe-readiness-local-browser.mjs
      - name: Verify protected PE bank boundaries and local assessment flow
        run: node --test --test-concurrency=1 tests/pe-final-privacy.test.mjs tests/pe-final-assessment.test.mjs tests/pe-final-staff-boundary.test.mjs
      - name: Verify native protected assessment and real lock waits
        run: node --test --test-concurrency=1 tests/pe-final-assessment.test.mjs tests/integration/pe-final-native.test.mjs
        env:
          PE_COURSE_NATIVE_CI: '1'
      - name: Render protected PE checks, final and complementary retake
        run: |
          xvfb-run --auto-servernum bash -c '
            openbox > "$RUNNER_TEMP/pe-final-openbox.log" 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            node tests/browser/pe-final-local-browser.mjs
          '
        env:
          PE_COURSE_NATIVE_CI: '1'
          PE_CHROMIUM_HEADED: '1'
          PLAYWRIGHT_LEGACY_SCREENSHOT: '1'
      - name: Retain only synthetic test reports, evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe03-isolated-acceptance-${{ github.run_id }}
          path: |
            artifacts/pe-cohort/driver/
            artifacts/pe-cohort/native/
            artifacts/pe-cohort/browser/
            artifacts/pe-course/browser/
            artifacts/pe-oil/native/
            artifacts/pe-final/native/
            artifacts/pe-final/browser/
          if-no-files-found: warn
          retention-days: 3
