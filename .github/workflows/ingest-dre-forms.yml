name: Ingest official California DRE forms

on:
  push:
    paths:
      - ".github/workflows/ingest-dre-forms.yml"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official forms supplied by owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p california/dre-sources

          curl -fL --retry 3 --retry-delay 2 \
            "https://at.adobe.com/E5fjI67RcvmNEg5Y" \
            -o california/dre-sources/RE311.pdf

          curl -fL --retry 3 --retry-delay 2 \
            "https://at.adobe.com/TpARKZK1JOjhNM5h" \
            -o california/dre-sources/RE313.doc

          curl -fL --retry 3 --retry-delay 2 \
            "https://at.adobe.com/x9FXr5ew5mVqW8Yb" \
            -o california/dre-sources/RE206E.pdf

          test -s california/dre-sources/RE311.pdf
          test -s california/dre-sources/RE313.doc
          test -s california/dre-sources/RE206E.pdf

          test "$(head -c 4 california/dre-sources/RE311.pdf)" = "%PDF"
          test "$(head -c 4 california/dre-sources/RE206E.pdf)" = "%PDF"
          test "$(xxd -p -l 8 california/dre-sources/RE313.doc)" = "d0cf11e0a1b11ae1"

      - name: Commit forms and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "StateCourse Repository Automation"
          git config user.email "westccmortgage@gmail.com"
          rm -f .github/workflows/ingest-dre-forms.yml
          git add california/dre-sources/RE311.pdf \
                  california/dre-sources/RE313.doc \
                  california/dre-sources/RE206E.pdf \
                  .github/workflows/ingest-dre-forms.yml
          git commit -m "Add official DRE RE311, RE313 and RE206E forms"
          git push origin HEAD:main
