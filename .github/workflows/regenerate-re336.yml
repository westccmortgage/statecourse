name: Regenerate California RE336 forms

on:
  push:
    branches:
      - "claude/new-session-e08nli"
    paths:
      - ".github/workflows/regenerate-re336.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/new-session-e08nli

      - name: Install PDF dependency
        run: python3 -m pip install --quiet pypdf

      - name: Regenerate official RE336 PDFs from current StateCourse LLC source data
        run: node scripts/fill-re336.mjs

      - name: Verify legacy provider name is absent from generated forms
        run: |
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          bad = []
          for path in Path('california/dre-sources/generated').glob('RE336-*.pdf'):
              text = '\n'.join((page.extract_text() or '') for page in PdfReader(str(path)).pages)
              if 'state course LLC' in text:
                  bad.append(str(path))
              if 'StateCourse LLC' not in text:
                  raise SystemExit(f'Expected legal name missing from {path}')
          if bad:
              raise SystemExit('Legacy provider name found in: ' + ', '.join(bad))
          print('Verified: all generated RE336 PDFs use StateCourse LLC')
          PY

      - name: Commit corrected generated forms
        run: |
          git config user.name "StateCourse Repository Automation"
          git config user.email "westccmortgage@gmail.com"
          git add california/dre-sources/generated/RE336-*.pdf
          git commit -m "Regenerate RE336 forms with StateCourse LLC legal name" || exit 0
          git push origin HEAD:claude/new-session-e08nli
