<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">North Carolina fixture decision lab</title>
  <desc id="desc">Eight illustrated disputed items and the four Total Circumstances Test questions.</desc>
  <rect width="1200" height="900" fill="#f6f1e8"/>
  <rect x="40" y="38" width="1120" height="824" rx="30" fill="#fff" stroke="#0b1739" stroke-width="4"/>
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0b1739">Fixture decision lab</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="21" fill="#42506a">Apply all four criteria to every illustrated item. No single picture decides the result.</text>
  <g font-family="Arial, sans-serif" fill="#0b1739" stroke="#0b1739" stroke-width="4">
    <g transform="translate(80 185)"><rect width="240" height="210" rx="18" fill="#f8e8b4" stroke="none"/><path d="M120 28v36m-50 0h100l-24 50H94zM90 114l-18 36m58-36 18 36m-28-36v40" fill="none"/><circle cx="72" cy="156" r="8" fill="#caa44c"/><circle cx="120" cy="164" r="8" fill="#caa44c"/><circle cx="148" cy="156" r="8" fill="#caa44c"/><text x="120" y="198" text-anchor="middle" font-size="19" stroke="none">Wired chandelier</text></g>
    <g transform="translate(345 185)"><rect width="240" height="210" rx="18" fill="#e7eef8" stroke="none"/><rect x="47" y="38" width="146" height="94" rx="5" fill="none"/><path d="M85 148h70m-35-16v16"/><text x="120" y="178" text-anchor="middle" font-size="18" stroke="none">Mounted TV</text><text x="120" y="200" text-anchor="middle" font-size="16" stroke="none">and bracket</text></g>
    <g transform="translate(610 185)"><rect width="240" height="210" rx="18" fill="#f8e8b4" stroke="none"/><rect x="65" y="33" width="110" height="130" rx="9" fill="none"/><circle cx="120" cy="98" r="38" fill="none"/><path d="M175 56c26 0 25 53 49 53" fill="none"/><text x="120" y="191" text-anchor="middle" font-size="18" stroke="none">Portable dishwasher</text></g>
    <g transform="translate(875 185)"><rect width="240" height="210" rx="18" fill="#e7eef8" stroke="none"/><rect x="60" y="30" width="120" height="130" fill="none"/><path d="M120 30v130M60 95h120"/><text x="120" y="190" text-anchor="middle" font-size="18" stroke="none">Custom storm windows</text></g>
    <g transform="translate(80 420)"><rect width="240" height="210" rx="18" fill="#e7eef8" stroke="none"/><path d="M55 154l50-110h30l50 110M77 105h86M120 105v48" fill="none"/><rect x="102" y="116" width="36" height="33" fill="#caa44c"/><path d="M45 160h150"/><text x="120" y="193" text-anchor="middle" font-size="18" stroke="none">Concrete-anchored swing</text></g>
    <g transform="translate(345 420)"><rect width="240" height="210" rx="18" fill="#f8e8b4" stroke="none"/><ellipse cx="120" cy="65" rx="75" ry="28" fill="#bde4f2"/><path d="M45 65v75c0 35 150 35 150 0V65" fill="none"/><path d="M70 88c30 14 70 14 100 0" fill="none"/><text x="120" y="193" text-anchor="middle" font-size="18" stroke="none">Above-ground pool</text></g>
    <g transform="translate(610 420)"><rect width="240" height="210" rx="18" fill="#e7eef8" stroke="none"/><rect x="55" y="34" width="130" height="132" fill="none"/><path d="M120 34v132M135 100h25"/><path d="M82 66h18m-9-9v18M82 105h18m-9-9v18"/><text x="120" y="193" text-anchor="middle" font-size="18" stroke="none">Tenant walk-in cooler</text></g>
