  <rect x="80" y="675" width="1040" height="135" rx="18" fill="#0b1739"/>
  <g font-family="Arial, sans-serif" fill="#fff"><text x="110" y="720" font-size="23" font-weight="700">1  Intent</text><text x="350" y="720" font-size="23" font-weight="700">2  Relationship</text><text x="635" y="720" font-size="23" font-weight="700">3  Annexation</text><text x="875" y="720" font-size="23" font-weight="700">4  Adaptation</text><text x="110" y="758" font-size="17">What objective intent</text><text x="350" y="758" font-size="17">Owner, tenant, seller?</text><text x="635" y="758" font-size="17">How is it attached?</text><text x="875" y="758" font-size="17">How custom is its use?</text><text x="110" y="785" font-size="17">do facts show?</text></g>
