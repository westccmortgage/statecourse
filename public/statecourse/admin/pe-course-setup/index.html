<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private PE course setup | StateCourse</title><link rel="stylesheet" href="/student/pe-course/course.css"><link rel="stylesheet" href="/student/pe-readiness/readiness.css"><link rel="stylesheet" href="/staff/security.css"><script src="/staff/action-proof.js"></script></head><body><main><header><a href="/admin/console/">Administration</a><p class="eyebrow">Private prerequisite-bound setup</p><h1>PE course and roster</h1><p>Creates a disabled 25-unit draft pinned to an already verified ROCS artifact. It does not activate instruction, credit, certificates, banking, deployment, or regulatory status.</p></header><p id="status" role="status"></p>
<form id="setup"><label>Course UUID<input id="courseId" required></label><label>Title<input id="title" maxlength="200" required></label><label>Timezone<input id="timezone" value="America/Los_Angeles" required></label><label>Opens at<input id="opensAt" type="datetime-local" required></label><label>Closes at<input id="closesAt" type="datetime-local" required></label><label>Assigned instructor UUID<input id="instructorId" required></label><label>Learner UUIDs, one per line<textarea id="learners" rows="5" required></textarea></label><label>ROCS version<input id="rocsVersion" required></label><label>ROCS source-document SHA-256<input id="rocsDocumentHash" minlength="64" maxlength="64" required></label><label>ROCS rendered-text SHA-256<input id="rocsRenderedHash" minlength="64" maxlength="64" required></label><button>Create disabled draft</button></form>
<section><h2>Scoped roster review</h2><form id="load"><label>Course UUID<input id="loadId" required></label><button>Load roster</button></form><pre id="result"></pre><form id="revoke" hidden><label>Learner UUID to revoke<input id="learnerId" required></label><button>Revoke assignment</button></form></section></main><script type="module" src="/admin/pe-course-setup/setup.mjs"></script></body></html>
