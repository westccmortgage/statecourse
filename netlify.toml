[build]
  command = "bash site/build.sh"
  publish = "dist"

[build.environment]
  # Production deploy 6abbf324 runs every retained Function on nodejs24.x.
  # Keep local/CI candidate metadata in the same runtime family.
  NODE_VERSION = "24"
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"

[functions]
  included_files = [
    # Protected transcripts. These are served only to an authorised enrollment by the stream
    # transcript endpoint, never copied into dist/, and are the text equivalent a student who
    # cannot use the video depends on — so the bundle has to carry every state's, not just one.
    "private-media/texas/*.txt",
    "private-media/california/*.txt",
    # The administration console reconciles the catalog against the files that describe it,
    # so the functions bundle has to carry them. They are read, never written.
    "public/statecourse/data/course-catalog.json",
    "config/regulatory-course-versions.json",
    "config/state-regulatory-controls.json",
    "video-production/portfolio.json",
    # Real NMLS instruction and assessment banks are server-only inputs.
    # Nothing under nmls/ is copied into the published dist/ directory.
    "nmls/curriculum/*.md",
    "nmls/assessment/2026/federal-revised-candidates.json",
    "nmls/assessment/2026/ethics-revised-candidates.json",
    "nmls/assessment/2026/nontraditional-revised-candidates.json",
    "nmls/assessment/2026/general-candidates.json",
    "nmls/evidence/2026-09-13/source-register.json",
    "nmls/evidence/2026-09-13/ai-body-review.json",
    "nmls/evidence/2026-09-13/acquisitions/2026-09-13T09-49-48-993Z-5f1d5dc2-b86c-4b0b-9b61-67e7a849776b/manifest.json",
    "nmls/evidence/2026-09-13/acquisitions/2026-09-13T09-49-48-993Z-5f1d5dc2-b86c-4b0b-9b61-67e7a849776b/*.html",
  ]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src https://*.cloudflarestream.com; img-src 'self' data:; script-src 'self' https://embed.cloudflarestream.com; style-src 'self'; connect-src 'self' https://upload.videodelivery.net"
    # connect-src carries Cloudflare's direct-upload host so the administration console can
    # send a video file straight from the operator's machine to Cloudflare. The alternative
    # is relaying a 25 MB upload through a function, and the alternative to that is the
    # status quo, where only a developer can add a video. It is an upload endpoint only: no
    # script, style, frame or image may load from it.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/enroll/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/payment/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/ai/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/student/*"
  [headers.values]
    Cache-Control = "no-store, private"

