[build]
  command = "bash site/build.sh"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/enroll/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/payment/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/student/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/student/*"
  [headers.values]
    Cache-Control = "no-store, private"

