[build]
  command = "bash site/build.sh"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/course"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/virginia"
  to = "/index.html"
  status = 200
